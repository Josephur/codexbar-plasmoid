name: Check upstream CodexBar

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  provider-list:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare the pinned provider list with the latest CodexBar CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-upstream-providers.sh
